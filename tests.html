<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<title>בדיקות גנרטור — הרפתקת המתמטיקה</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f5f2fb; }
  .pass { color: #1f8a4d; }
  .fail { color: #c43e3e; font-weight: bold; }
  pre { background: #fff; padding: 8px; border-radius: 8px; }
  h3 { margin: 18px 0 6px; }
</style>
</head>
<body>
<h1>בדיקות גנרטור (1,000 דגימות לכל שלב)</h1>
<p>אפשר להריץ גם מהטרמינל: <code>node tests/run.mjs</code></p>
<div id="out">רץ...</div>
<script type="module">
import { levels as noyaLevels, worlds as noyaWorlds, meta as noyaMeta } from './js/curriculum/noya.js';
import { levels as alinLevels } from './js/curriculum/alin.js';
import { checkLevel, checkExam } from './tests/checks.js';

const out = document.getElementById('out');
out.innerHTML = '';
const N = 1000;
let failures = 0;

function section(title) {
  const h = document.createElement('h3');
  h.textContent = title;
  out.appendChild(h);
}
function report(id, title, errors) {
  const div = document.createElement('div');
  if (errors.length === 0) {
    div.className = 'pass';
    div.textContent = `✓ ${id} — ${title}`;
  } else {
    failures++;
    div.className = 'fail';
    div.innerHTML = `✗ ${id} — ${title}<pre>${errors.slice(0, 5).join('\n')}</pre>`;
  }
  out.appendChild(div);
}

section('נויה — כיתה ג׳');
for (const level of noyaLevels) report(level.id, level.title, checkLevel(level, N));

section('מבחנים');
for (const w of noyaWorlds) {
  const wl = noyaLevels.filter(l => l.world === w.n);
  report(`exam:${w.n}`, `מבחן ${w.name}`, checkExam(wl, noyaMeta.exam.questions));
}
report('exam:final', 'המבחן הגדול', checkExam(noyaLevels, noyaMeta.exam.finalQuestions));

section('אלין — גיל הגן');
for (const level of alinLevels) report(level.id, level.title, checkLevel(level, N));

const summary = document.createElement('h2');
summary.className = failures ? 'fail' : 'pass';
summary.textContent = failures ? `${failures} שלבים נכשלו` : 'כל הבדיקות עברו ✓';
out.prepend(summary);
document.title = (failures ? 'FAIL' : 'PASS') + ' — בדיקות';
</script>
</body>
</html>
